experiment:
  id: M5
  name: standard_cnn_224_roi
  seed: 42
  description: "Standard CNN at 224x224 with knee-joint ROI center crop"

preprocessing:
  image_size: [224, 224]
  contrast: none
  normalize: raw

roi:
  enabled: true
  margin_h: 0.18
  margin_w: 0.22

model:
  architecture: standard_cnn
  pretrained: false
  dropout: 0.3

training:
  batch_size: 32
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  augmentation: light
